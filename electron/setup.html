<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FishEye Setup</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        background: #f9fafb;
        color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .card {
        width: 400px;
        padding: 28px;
      }
      h1 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        color: #6b7280;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        font-family: inherit;
        font-size: 13px;
        border-radius: 8px;
        padding: 9px 14px;
        cursor: pointer;
        border: 1px solid transparent;
      }
      button.primary {
        background: #2563eb;
        color: white;
        border: none;
      }
      button.primary:hover {
        background: #1d4ed8;
      }
      button.secondary {
        background: white;
        color: #374151;
        border: 1px solid #d1d5db;
      }
      button.secondary:hover {
        background: #f9fafb;
      }
      button.retry {
        background: white;
        color: #374151;
        border: 1px solid #d1d5db;
      }
      #status-label {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #374151;
        margin-bottom: 8px;
      }
      #status-label span:last-child {
        color: #9ca3af;
        font-variant-numeric: tabular-nums;
      }
      .bar-track {
        width: 100%;
        height: 8px;
        background: #f3f4f6;
        border-radius: 999px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 999px;
        background: #3b82f6;
        transition: width 0.3s ease-out;
        width: 0%;
      }
      .bar-fill.indeterminate {
        width: 40%;
        animation: indeterminate 1.1s ease-in-out infinite;
      }
      @keyframes indeterminate {
        0% {
          margin-left: -40%;
        }
        100% {
          margin-left: 100%;
        }
      }
      #error-text {
        font-size: 13px;
        color: #dc2626;
        background: #fef2f2;
        border-radius: 8px;
        padding: 10px 12px;
        margin: 0 0 16px;
        display: none;
      }
      .screen {
        display: none;
      }
      .screen.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>One-time setup</h1>

      <div id="screen-initial" class="screen active">
        <p>
          FishEye needs to download about 2.3 GB of additional files the first time it runs. These files are required for processing and only need to be downloaded once.
        </p>
        <div class="buttons">
          <button id="download-btn" class="primary">Download automatically</button>
          <button id="local-file-btn" class="secondary">I already have the files…</button>
        </div>
      </div>

      <div id="screen-progress" class="screen">
        <p id="error-text"></p>
        <div id="status-label">
          <span id="status-phase">Starting…</span>
          <span id="status-detail"></span>
        </div>
        <div class="bar-track">
          <div id="bar-fill" class="bar-fill"></div>
        </div>
        <div class="buttons" id="retry-buttons" style="margin-top: 16px; display: none">
          <button id="retry-btn" class="retry">Try again</button>
        </div>
      </div>
    </div>
    <script src="setup.js"></script>
  </body>
</html>
