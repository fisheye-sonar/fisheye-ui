name: Feature Request
description: Suggest an idea that would make FishEye more useful.
title: "[Feature]: "
labels: ["enhancement", "triage"]
projects: ["fisheye-ui"]
assignees:
  - madivanhorn
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make FishEye more useful? Tell us about it below.
        You don't need to provide a technical solution, just describe what you need.
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What would you like FishEye to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would this feature be useful?
    validations:
      required: true
  - type: textarea
    id: current-workaround
    attributes:
      label: How do you currently handle this task?
      description: Tell us how you work around this today, if at all.
    validations:
      required: false
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Any examples that might help us understand the request (screenshots, files, links, etc.).
    validations:
      required: false