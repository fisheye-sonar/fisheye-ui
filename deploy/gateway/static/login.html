<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishEye</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f9fafb;
        color: #374151;
      }
      .card {
        max-width: 26rem;
        width: 90%;
        text-align: center;
        padding: 2.5rem 2rem;
      }
      .fish {
        width: 5rem;
        height: auto;
        display: inline-block;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #111827;
        margin: 1rem 0 0.5rem;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.4;
        color: #6b7280;
        margin: 0.25rem 0;
      }
      a {
        color: #2563eb;
      }
      a:hover {
        text-decoration: none;
      }
      form {
        margin-top: 1.5rem;
        text-align: left;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        color: #374151;
        margin: 0.75rem 0 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem 0.625rem;
        font-size: 0.9rem;
        border: 1px solid #d1d5db;
        border-radius: 0.375rem;
      }
      input:focus {
        outline: none;
        border-color: #2563eb;
      }
      button {
        margin-top: 1.25rem;
        width: 100%;
        padding: 0.625rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 500;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 0.375rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        background: #93c5fd;
        cursor: default;
      }
      .error {
        display: none;
        margin-top: 1rem;
      }
      .error.visible {
        display: block;
      }
      .error p {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="fish" src="fisheye_blue_combined.svg" alt="" />
      <h1>Sign in to FishEye</h1>
      <p>
        Don't have a code yet?
        <a
          href="https://docs.google.com/forms/d/e/1FAIpQLSdcFlfHc9t18jregFgqe-DpXS0pwbkTSrn4Yxy9yNiA5-PNRA/viewform?usp=header"
          target="_blank"
          rel="noopener noreferrer"
          >Request access</a
        >
        and one will be emailed to you.
      </p>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" />
        <label for="code">Access code</label>
        <input type="text" id="code" name="code" required autocomplete="one-time-code" />
        <button type="submit" id="submit">Sign in</button>
      </form>
      <div class="error" id="error">
        <p id="error-message">That email/code combination wasn't recognized.</p>
      </div>
    </div>
    <script>
      const form = document.getElementById("login-form");
      const submitButton = document.getElementById("submit");
      const errorBox = document.getElementById("error");
      const errorMessage = document.getElementById("error-message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.classList.remove("visible");
        submitButton.disabled = true;
        submitButton.textContent = "Signing in...";

        try {
          const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value,
              code: document.getElementById("code").value,
            }),
          });

          if (res.ok) {
            window.location.href = "/";
            return;
          }

          errorMessage.textContent =
            res.status === 401
              ? "That email/code combination wasn't recognized."
              : "Something went wrong - please try again.";
          errorBox.classList.add("visible");
        } catch {
          errorMessage.textContent = "Couldn't reach the server - please try again.";
          errorBox.classList.add("visible");
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Sign in";
        }
      });
    </script>
  </body>
</html>
